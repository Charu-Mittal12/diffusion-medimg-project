# ============================================================
# FULL / REAL config — actual training values, takes 1-2+ hours.
# Only run this AFTER config_smoke.yaml has passed cleanly.
# Pass explicitly: --config configs/config_full.yaml
# ============================================================

project:
  name: "diffusion-medimg"
  wandb_project: "diffusion-medical-imaging"
  wandb_entity: null
  seed: 42
  output_dir: "outputs"

data:
  dataset_source: "kaggle_mount"   # "kaggle_mount" (fast, needs Kaggle's NIH Chest X-rays added as Input) or "huggingface" (slow, works anywhere)
  kaggle_mount_dir: "/kaggle/input/datasets/nih-chest-xrays/data"   # confirm with `!ls /kaggle/input` if this ever changes
  hf_dataset_id: "alkzar90/NIH-Chest-X-ray-dataset"   # only used when dataset_source is "huggingface"
  hf_dataset_config: "image-classification"   # other option is "object-detection" — different subset/labels
  target_pathology: "Hernia"
  n_finetune_images: 50
  n_negative_pool: 5000
  test_split_fraction: 0.2
  image_export_dir: "data/lora_train_images"
  caption_template: "a chest x-ray showing {class_name}"
  class_name: "a hernia"
  resolution_on_disk: 512

lora_training:
  base_model: "runwayml/stable-diffusion-v1-5"
  resolution: 512
  train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-4
  lr_scheduler: "constant"
  max_train_steps: 800
  lora_rank: 8
  lora_alpha: 16
  mixed_precision: "fp16"
  checkpointing_steps: 200
  output_dir: "outputs/lora-weights"
  prior_preservation: true
  num_class_images: 100
  prior_loss_weight: 1.0
  class_prompt: "a chest x-ray"

generation:
  num_synthetic_images: 1000
  num_inference_steps: 30
  guidance_scale: 2.0
  resolution: 512
  output_dir: "outputs/synthetic_images"

diversity_check:
  lpips_net: "alex"
  nn_similarity_metric: "lpips"
  nn_flag_threshold: 0.05

classifier:
  model: "resnet18"
  pretrained: true
  epochs: 15
  batch_size: 32
  learning_rate: 1.0e-4
  synthetic_ratios: [0.0, 0.5, 1.0, 2.0, 4.0, 10.0]
  cv_folds: 5

denoising:
  noise_type: "gaussian"
  gaussian_sigma: 25
  partial_denoise_start_frac: 0.3
  classical_baselines: ["median", "gaussian_blur"]
  median_kernel_size: 3
  gaussian_blur_kernel_size: 3